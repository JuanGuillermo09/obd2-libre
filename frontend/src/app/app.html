<div class="min-h-screen flex flex-col bg-gray-50 relative">
  <!-- Watermark -->
  <div class="absolute inset-0 bg-center bg-contain bg-no-repeat opacity-20 pointer-events-none"
       style="background-image: url('/logo-obd2libre-claro.png'); z-index: 0;"></div>
  
  <!-- Header -->
  <header class="bg-primary text-white shadow-lg relative z-10">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <a routerLink="/" class="flex items-center gap-2 hover:opacity-90">
          <img src="/icon-512.png" alt="OBD2 Libre" class="h-8 w-8">
          <span class="text-xl font-bold">OBD2 Libre</span>
        </a>
        <!-- Menú hamburguesa para móvil -->
        <button class="md:hidden p-2" (click)="mobileMenuOpen = !mobileMenuOpen" aria-label="Menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>

        <!-- Menú principal -->
        <nav class="hidden md:flex gap-4 text-sm">
          <a routerLink="/codigos" routerLinkActive="underline font-bold" class="hover:underline">Códigos</a>
          <a routerLink="/buscar" routerLinkActive="underline font-bold" class="hover:underline">Buscar</a>
          <a routerLink="/acerca-de" routerLinkActive="underline font-bold" class="hover:underline">Acerca de</a>
          <a routerLink="/contribuir" routerLinkActive="underline font-bold" class="hover:underline">Contribuir</a>
          <a routerLink="/sugerencias" routerLinkActive="underline font-bold" class="hover:underline">Sugerencias</a>
        </nav>

        <!-- Menú móvil -->
        <nav [class.hidden]="!mobileMenuOpen" class="absolute top-full left-0 w-full bg-primary-dark p-4 flex flex-col gap-3 text-sm md:hidden z-20">
          <a routerLink="/codigos" routerLinkActive="underline font-bold" (click)="mobileMenuOpen = false">Códigos</a>
          <a routerLink="/buscar" routerLinkActive="underline font-bold" (click)="mobileMenuOpen = false">Buscar</a>
          <a routerLink="/acerca-de" routerLinkActive="underline font-bold" (click)="mobileMenuOpen = false">Acerca de</a>
          <a routerLink="/contribuir" routerLinkActive="underline font-bold" (click)="mobileMenuOpen = false">Contribuir</a>
          <a routerLink="/sugerencias" routerLinkActive="underline font-bold" (click)="mobileMenuOpen = false">Sugerencias</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-gray-300 py-6 mt-12">
    <div class="max-w-4xl mx-auto px-4 text-center text-sm">
      <p class="mb-2">
        ⚠️ La información es orientativa y no reemplaza un diagnóstico profesional.
      </p>
      <p class="mb-2">
        <a routerLink="/creditos" class="hover:underline">Créditos y licencias</a>
      </p>
      <p class="text-gray-500">
        Hecho con ❤️ para la comunidad automotriz colombiana
      </p>
    </div>
  </footer>
</div>
